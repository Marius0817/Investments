# Betrieb auf dem Server:
#   1. mkdir config && cp src/stopguard/data/config.example.toml config/stopguard.toml  (anpassen!)
#   2. docker compose build
#   3. docker compose run --rm stopguard login      # Device-Login: Link im Browser öffnen, Code bestätigen
#   4. docker compose run --rm stopguard doctor
#   5. docker compose up -d                         # Überwachung im Hintergrund
#   Order-Änderungen bestätigen:  docker compose run --rm stopguard apply
#   oder in der Weboberfläche:     docker compose --profile web up -d  (siehe unten)
services:
  stopguard:
    build: .
    image: stopguard:latest
    restart: unless-stopped
    init: true
    environment:
      TZ: Europe/Berlin
      STOPGUARD_CONFIG: /config/stopguard.toml
      # Geheimnisse nur über die Umgebung (z. B. .env-Datei neben dieser Datei):
      STOPGUARD_NTFY_TOKEN: ${STOPGUARD_NTFY_TOKEN:-}
      STOPGUARD_TELEGRAM_TOKEN: ${STOPGUARD_TELEGRAM_TOKEN:-}
    volumes:
      - ./config:/config:ro
      - stopguard-home:/home/stopguard
    command: ["daemon"]

  # Optional: Weboberfläche (inkl. JSON-API unter /api/v1/…)
  #   echo "STOPGUARD_WEB_TOKEN=$(openssl rand -hex 24)" >> .env
  #   docker compose --profile web up -d   →   http://127.0.0.1:8765/
  # Standardmäßig nur vom Host selbst erreichbar. Fürs Heimnetz (z. B. Raspberry Pi) den Port als
  # "8765:8765" veröffentlichen oder einen Reverse-Proxy mit HTTPS davorsetzen; ohne Token startet
  # die Oberfläche im Netzwerk nicht.
  stopguard-web:
    image: stopguard:latest
    profiles: ["web"]
    restart: unless-stopped
    init: true
    environment:
      TZ: Europe/Berlin
      STOPGUARD_CONFIG: /config/stopguard.toml
      STOPGUARD_WEB_TOKEN: ${STOPGUARD_WEB_TOKEN:-}
      STOPGUARD_NTFY_TOKEN: ${STOPGUARD_NTFY_TOKEN:-}
      STOPGUARD_TELEGRAM_TOKEN: ${STOPGUARD_TELEGRAM_TOKEN:-}
    volumes:
      - ./config:/config:ro
      - stopguard-home:/home/stopguard
    command: ["web", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/v1/health', timeout=5)"]
      interval: 5m
      timeout: 10s

volumes:
  stopguard-home:
